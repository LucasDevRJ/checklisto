<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- ========================================================================
       LOGO CHECKLISTO: CRISTAL DE CHECK AURORA (SVG Vetorial)
       ========================================================================
       Como funciona um arquivo SVG:
       - <defs>: Define gradientes de cor e efeitos de brilho (filtros)
       - <polygon>: Desenha as facetas geométricas do cristal usando coordenadas (x,y)
       - <path>: Desenha o símbolo de Check ("✓") no centro com cantos arredondados
       ======================================================================== -->
  <defs>
    <!-- Gradiente principal Aurora (Ciano -> Violeta -> Esmeralda) -->
    <linearGradient id="auroraBase" x1="12" y1="10" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="52%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Faceta superior iluminada (reflexo de vidro) -->
    <linearGradient id="facetaLuz" x1="60" y1="8" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.12" />
    </linearGradient>

    <!-- Faceta lateral esquerda (tom ciano cristalino) -->
    <linearGradient id="facetaEsquerda" x1="14" y1="30" x2="60" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15" />
    </linearGradient>

    <!-- Faceta lateral direita (tom lilás/esmeralda) -->
    <linearGradient id="facetaDireita" x1="106" y1="30" x2="60" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.45" />
    </linearGradient>

    <!-- Gradiente do Check central -->
    <linearGradient id="checkGradiente" x1="36" y1="62" x2="86" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Filtro de brilho suave (Glow) ao redor do cristal e do check -->
    <filter id="brilhoCristal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Corpo externo do Cristal Octogonal Lapidado -->
  <polygon
    points="60,8 98,26 110,64 90,100 60,112 30,100 10,64 22,26"
    fill="url(#auroraBase)"
    fill-opacity="0.28"
    stroke="url(#auroraBase)"
    stroke-width="2.5"
    filter="url(#brilhoCristal)"
  />

  <!-- 2. Facetas internas de vidro (criam a sensação 3D de lapidação) -->
  <!-- Faceta topo -->
  <polygon points="60,8 98,26 82,42 38,42 22,26" fill="url(#facetaLuz)" />
  <!-- Faceta esquerda -->
  <polygon points="22,26 38,42 34,78 10,64" fill="url(#facetaEsquerda)" />
  <!-- Faceta direita -->
  <polygon points="98,26 110,64 86,78 82,42" fill="url(#facetaDireita)" />
  <!-- Faceta base inferior -->
  <polygon points="34,78 86,78 90,100 60,112 30,100" fill="#10b981" fill-opacity="0.22" />

  <!-- 3. Mesa central do cristal (painel de vidro fosco onde fica o Check) -->
  <polygon
    points="38,42 82,42 86,78 60,92 34,78"
    fill="#0f172a"
    fill-opacity="0.38"
    stroke="#ffffff"
    stroke-opacity="0.45"
    stroke-width="1.5"
  />

  <!-- 4. Linhas sutis das arestas do cristal -->
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.2">
    <line x1="60" y1="8" x2="60" y2="42" />
    <line x1="22" y1="26" x2="38" y2="42" />
    <line x1="98" y1="26" x2="82" y2="42" />
    <line x1="10" y1="64" x2="34" y2="78" />
    <line x1="110" y1="64" x2="86" y2="78" />
    <line x1="60" y1="92" x2="60" y2="112" />
  </g>

  <!-- 5. Símbolo de Check ("✓") luminoso no coração do cristal -->
  <path
    d="M41 61.5L54.5 75L81 46.5"
    stroke="url(#checkGradiente)"
    stroke-width="8.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#brilhoCristal)"
  />

  <!-- 6. Pequenos pontos de brilho estelar (reflexo nas quinas) -->
  <circle cx="38" cy="42" r="2.2" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="82" cy="42" r="1.8" fill="#ffffff" fill-opacity="0.75" />
  <circle cx="60" cy="14" r="2" fill="#ffffff" fill-opacity="0.85" />
</svg>
